name: 매일 말씀 카드 발행

on:
  schedule:
    # GitHub Actions 는 UTC 기준입니다. (한국시간 = UTC + 9시간)
    #
    # 목표: 한국시간 오전 6시 발행
    #
    # 무료 저장소의 예약 실행은 GitHub 대기열에 밀려 늦게 시작됩니다.
    # 이 저장소의 2026-10-27 ~ 11-02 실행 기록을 보면 예약 시각보다
    # 약 3시간(2시간 56분 ~ 3시간 40분) 늦게 실행됐습니다.
    # 그래서 그 밀림을 역산해, 예약은 18:00 UTC(= 한국시간 새벽 3시)로 두고
    # 실제 발행이 한국시간 오전 6시 ~ 7시에 걸리도록 맞췄습니다.
    #
    # 혹시 GitHub 이 밀리지 않고 정시에 실행하는 날은 새벽 3시에 올라갑니다.
    # 발행 시각을 더 늦추려면 아래 시(hour)를 올리고, 당기려면 내리십시오.
    #   '0 18 * * *' → 예약 새벽 3시, 실제 약 오전 6~7시  (현재 설정)
    #   '0 19 * * *' → 예약 새벽 4시, 실제 약 오전 7~8시
    #   '0 20 * * *' → 예약 새벽 5시, 실제 약 오전 8~9시
    - cron: '0 18 * * *'
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 생성된 카드를 저장소에 커밋하기 위해 필요

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 오늘 이미 만들었는지 확인
        id: gate
        run: |
          # 수동 실행 뒤 예약 실행이 또 돌면 같은 날 두 장이 올라갑니다(2026-11-03). 예약 실행만 건너뜁니다.
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "out/${today}.jpg" ]; then
            echo "오늘 카드가 이미 있어 예약 실행을 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 파이썬 준비
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트 설치
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: 의존성 설치
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 카드 생성
        if: steps.gate.outputs.skip != 'true'
        run: python make_card.py

      - name: 저장소에 카드 커밋
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "bibledaily-bot"
          git config user.email "actions@github.com"
          git add out/ cursor.txt
          git commit -m "카드 생성: $(date -u -d '+9 hours' +%Y-%m-%d)" || echo "변경 사항 없음"
          git push
      - name: 인스타그램 발행
        if: steps.gate.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "토큰이 아직 없어 발행을 건너뜁니다."
            exit 0
          fi
          python publish.py

