name: 주간 말씀 릴스

on:
  schedule:
    # UTC 기준입니다. 일요일 00:00 UTC = 한국시간 일요일 오전 9시
    - cron: '0 0 * * 0'
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트 · ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 릴스 영상 만들기
        run: python make_reel.py

      - name: 오래된 릴스 정리 (최근 8개만 보관)
        run: |
          ls -1t out/reel_*.mp4 2>/dev/null | tail -n +9 | xargs -r rm -f
          echo "남은 영상: $(ls -1 out/reel_*.mp4 2>/dev/null | wc -l)개"

      - name: 저장소에 영상 커밋
        run: |
          git config user.name  "bibledaily-bot"
          git config user.email "actions@github.com"
          git add out/
          git commit -m "릴스 생성: $(date -u -d '+9 hours' +%Y-%m-%d)" || echo "변경 사항 없음"
          git push

      - name: Pages 배포 대기
        run: sleep 60

      - name: 인스타그램 릴스 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "토큰이 아직 없어 발행을 건너뜁니다."
            exit 0
          fi
          python publish_reel.py
